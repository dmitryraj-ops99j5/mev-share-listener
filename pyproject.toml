[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mev-share-listener"
version = "0.2.1"
description = "Lightweight SSE listener and filter for Flashbots MEV-Share hints"
authors = [{ name = "Alexey K." }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "pydantic>=2.4.0",
    "orjson>=3.9.0",
]

[project.scripts]
mev-share-listener = "mev_share_listener.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]
